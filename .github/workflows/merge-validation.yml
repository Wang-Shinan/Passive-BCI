name: Merge validation

on:
  push:
    branches: [merge]
  pull_request:
    branches: [main, merge]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: merge-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Typecheck and production build
        run: npm run build
      - name: Project tests
        if: ${{ !cancelled() }}
        run: npm test
      - name: Integration contract tests
        if: ${{ !cancelled() }}
        run: |
          node --test scripts/test-reve-launch-options.mjs
          node --experimental-strip-types --test scripts/test-brain-control-task.mjs
          node --experimental-strip-types --test scripts/test-model-integration.mjs
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint
      - name: Browser control-flow regression (mock model and recording)
        if: ${{ !cancelled() }}
        run: |
          npm install --prefix "$RUNNER_TEMP/tetris-playwright" --no-package-lock --ignore-scripts playwright@1.56.1
          "$RUNNER_TEMP/tetris-playwright/node_modules/.bin/playwright" install --with-deps chromium
          PLAYWRIGHT_MODULE="$RUNNER_TEMP/tetris-playwright/node_modules/playwright/index.mjs" node scripts/test-tetris-ui.mjs
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: tetris-ui-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
