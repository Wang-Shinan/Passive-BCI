name: Validate reviewed Tetris integration

on:
  push:
    branches: [merge]
    paths:
      - '.github/tetris-edit-part-*.b64'
      - '.github/apply-reviewed-tetris.py'
      - '.github/workflows/apply-reviewed-tetris.yml'

permissions:
  contents: read

concurrency:
  group: reviewed-tetris-integration
  cancel-in-progress: true

jobs:
  validate:
    if: github.ref == 'refs/heads/merge'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Apply hash-locked reviewed text edits
        run: python .github/apply-reviewed-tetris.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Project tests
        run: npm test
      - name: Integration contract tests
        run: |
          node --test scripts/test-reve-launch-options.mjs
          node --experimental-strip-types --test scripts/test-brain-control-task.mjs
          node --experimental-strip-types --test scripts/test-model-integration.mjs
      - run: npm run lint
      - name: Browser interaction regression (mocked model and recording)
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
          node scripts/test-tetris-ui.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reviewed-tetris-ui-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: validate
    if: github.ref == 'refs/heads/merge'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Apply only the same reviewed edits and fast-forward merge
        env:
          REVIEWED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/merge | cut -f1)" = "$REVIEWED_HEAD"
          python .github/apply-reviewed-tetris.py
          git diff --check
          git add -- src scripts tests vite.*.ts
          git -c core.hooksPath=/dev/null -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: unify Tetris model lifecycle, recording locks and gaze head selection'
          test "$(git ls-remote origin refs/heads/merge | cut -f1)" = "$REVIEWED_HEAD"
          git push origin HEAD:refs/heads/merge
